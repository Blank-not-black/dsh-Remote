<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>中转申请审核 · DSH Remote</title><link rel="stylesheet" href="/sponsor/style.css"><script src="/sponsor/portal.js" defer></script></head>
<body data-admin><main><header><span class="eyebrow">DSH REMOTE · 运营管理</span><h1>中转申请审核</h1><p>在微信收款端核实真实到账，审核后生成开通邮件，人工发送。</p></header>
<section class="card"><form id="admin-form"><label>审核密钥<input id="admin-token" type="password" autocomplete="off" required></label><button type="submit">读取申请</button><button id="reload" type="button" hidden>刷新申请</button><button id="logout" type="button">退出并清除页面信息</button></form><p id="admin-capacity"></p></section>
<section id="admin-controls" class="card" hidden><h2>申请与资格</h2><p id="accepting-status"></p><button id="toggle-accepting" type="button">暂停新申请</button><p>暂停不影响已有编号提交、人工审核及有效连接。环境配置的紧急暂停优先。</p><label>筛选申请<select id="filter"><option value="all">全部</option><option value="submitted">待审核</option><option value="unsent">待发送</option><option value="approved">有效资格</option><option value="expired">已到期</option><option value="revoked">已撤销</option><option value="rejected">未通过</option></select></label><label>查找申请编号或邮箱<input id="search" type="search" autocomplete="off" maxlength="254"></label></section>
<p id="message" class="notice" role="status" aria-live="polite"></p><section id="applications" aria-label="申请列表"></section>
<section id="review" class="card" hidden><h2 id="review-title"></h2><p id="review-info"></p><img id="review-proof" class="proof" alt="申请人付款截图"><form id="review-form"><label>微信收款端交易编号<input id="receipt" maxlength="120" autocomplete="off" required></label><label class="check"><input id="verified" type="checkbox" required>我已在自己的微信收款记录中核实到账、金额和申请编号，且确认不是重复申请。</label><button id="approve" type="submit">审核通过并生成一个月密钥</button></form><label>未通过原因／退款处理说明<textarea id="reject-note" maxlength="300" rows="3"></textarea></label><button id="reject" type="button" class="secondary">审核不通过</button></section>
<section id="delivery" class="card" hidden><h2>人工发送开通邮件</h2><p id="delivery-email"></p><label>邮件主题<input id="delivery-subject" readonly></label><label>邮件正文<textarea id="delivery-text" rows="15" readonly></textarea></label><button id="copy-mail" type="button">复制邮件正文</button><button id="delivered" type="button">我已向该邮箱发送</button><p>生成正文不会发送邮件。确认实际发出后再标记，网络中断可重新读取同一份开通信息。</p></section>
<section id="revoke-panel" class="card" hidden><h2 id="revoke-title">撤销使用资格</h2><p>撤销后云端将拒绝新的连接并断开现有连接，原密钥无法再次使用。此操作不会退款或发送通知，请另行联系申请人处理。</p><label>撤销原因与后续处理说明<textarea id="revoke-note" maxlength="300" rows="3"></textarea></label><label class="check"><input id="revoke-confirm" type="checkbox">我确认要撤销这份申请当前的使用资格</label><button id="revoke" type="button" class="secondary">确认撤销资格</button></section>
</main></body></html>
