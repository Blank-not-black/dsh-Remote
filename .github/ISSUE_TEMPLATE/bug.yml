name: 🐞 Bug 报告
description: 用着有问题？尽量把环境/版本信息填全，方便我们定位
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜一下[已有 Issue](https://github.com/Blank-not-black/dsh-Remote/issues?q=is%3Aissue)，避免重复。
        请遵守[社区行为准则](https://github.com/Blank-not-black/dsh-Remote/blob/main/CODE_OF_CONDUCT.md)。安全漏洞请按[安全政策](https://github.com/Blank-not-black/dsh-Remote/blob/main/SECURITY.md)私下报告，不要公开利用细节。
  - type: input
    id: version
    attributes:
      label: 版本号
      description: 涉及多个组件时请都列出（App / 插件 / 网关），可在设置页或管理抽屉里查看
      placeholder: 填写实际 App / 插件 / 网关版本；使用源码时附提交号和分支
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: 手机环境（非手机端问题可填 N/A）
      description: 手机型号、Android / HarmonyOS 版本，或说明使用浏览器
      placeholder: 例：Xiaomi 15 / Android 15；也可填写 HarmonyOS 版本
  - type: input
    id: connection
    attributes:
      label: 连接方式（网络相关问题请填写）
      description: 局域网 / 公网直连 / 中继，Wi-Fi / 蜂窝网络，是否使用 VPN；不要粘贴带 token 的地址
  - type: input
    id: desktop
    attributes:
      label: 电脑环境
      description: 操作系统、浏览器、DSH 版本等
      placeholder: 例：Ubuntu 24.04 + Chrome + DSH Web
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 现象、报错信息、出问题的页面或操作
      placeholder: 描述得越具体越好……
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你预期应该发生什么
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图（可选）
      description: 提供相关日志或截图，先移除 token、Cookie、连接二维码、私有地址与会话内容；日志获取方式见故障排查文档
