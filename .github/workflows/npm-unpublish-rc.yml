name: npm-unpublish-rc

# 一次性清理: 撤回误发的 dsh-remote-plugin@0.5.6-rc.1
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unpublish rc version
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm unpublish dsh-remote-plugin@0.5.6-rc.1 --force --//registry.npmjs.org/:_authToken="${NPM_TOKEN}"
          echo "unpublished 0.5.6-rc.1"
