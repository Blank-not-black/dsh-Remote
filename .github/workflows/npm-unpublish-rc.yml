name: npm-unpublish-rc

# 一次性清理: 撤回误发的 dsh-remote-plugin@0.5.6-rc.1
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix dist-tags and deprecate rc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm dist-tag add dsh-remote-plugin@0.5.5 latest --//registry.npmjs.org/:_authToken="${NPM_TOKEN}"
          npm deprecate dsh-remote-plugin@0.5.6-rc.1 "误发版本，请使用 0.5.5" --//registry.npmjs.org/:_authToken="${NPM_TOKEN}" || true
          echo "latest -> 0.5.5; rc deprecated"
