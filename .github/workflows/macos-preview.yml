name: macos-preview

# macOS (Apple Silicon) 单文件网关预览版构建。
# 常规版本已由 release-build 同版构建；这里保留手动预览入口。
# 复用相同构建、签名和冒烟步骤，发布到独立 prerelease tag。
# 作者无 macOS 设备, CI 运行全量仓库检查和签名产物冒烟, 仍需用户真机验证。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-build:
    uses: ./.github/workflows/macos-build.yml

  release:
    needs: macos-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download verified macOS binary
        uses: actions/download-artifact@v4
        with:
          name: macos-binary
          path: dist

      - name: Generate SHA256
        run: |
          cd dist
          sha256sum dsh-remote-macos-arm64 | tee SHA256SUMS-macos.txt

      - name: Determine preview tag
        run: |
          V="v$(node -p "require('./package.json').version")"
          echo "RELEASE_TAG=${V}-macos-preview" >> "$GITHUB_ENV"
          echo "Preview tag: ${V}-macos-preview"

      - name: Delete previous preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${RELEASE_TAG}" --yes --cleanup-tag 2>/dev/null || true

      - name: Write release notes
        run: |
          node -e "
            const fs = require('fs');
            const sums = fs.readFileSync('dist/SHA256SUMS-macos.txt', 'utf8').trim();
            const body = '# DSH Remote macOS 预览版（Apple Silicon）\n\n' +
              '> ⚠️ **预览版本**：作者没有 macOS 设备。CI 在 Apple Silicon runner 上执行全量仓库检查，并对产物做 ad-hoc 签名、验签及 supervisor 启动、健康检查、静态资源和关闭冒烟；未经过用户真机验证，也不代表完整 DSH 集成验证。如遇 bug 请到 [Issues](https://github.com/Blank-not-black/dsh-Remote/issues/new/choose) 反馈。\n' +
              '> **更新周期**：常规版本已随主发布 CI 同版构建，此页面用于手动预览。npm 插件安装无需另下此网关；产物不包含 DSH 本身。\n\n' +
              '## 适用平台\n\n' +
              '- 仅适用于 Apple Silicon（M 系列）Mac\n' +
              '- Intel Mac 暂不提供，请使用源码运行（需 Node.js）\n\n' +
              '## 首次运行\n\n' +
              '产物未做 Apple 公证，首次打开如被 Gatekeeper 拦截，请右键「打开」，或执行：\n\n' +
              '\`\`\`\n' +
              'xattr -d com.apple.quarantine dsh-remote-macos-arm64\n' +
              '\`\`\`\n\n' +
              '## SHA-256\n\n\`\`\`\n' + sums + '\n\`\`\`\n';
            fs.writeFileSync('RELEASE_NOTES_MAC.md', body);
          "
          cat RELEASE_NOTES_MAC.md

      - name: Upload preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: true
          body_path: RELEASE_NOTES_MAC.md
          fail_on_unmatched_files: true
          files: |
            dist/dsh-remote-macos-arm64
            dist/SHA256SUMS-macos.txt
