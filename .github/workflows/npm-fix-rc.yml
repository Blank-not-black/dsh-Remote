name: npm-fix-rc

# 一次性清理: 把 latest 指回 0.5.6 并弃用误发的 0.5.7-rc.1
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore latest and deprecate rc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm dist-tag add dsh-remote-plugin@0.5.6 latest --//registry.npmjs.org/:_authToken="${NPM_TOKEN}"
          npm deprecate dsh-remote-plugin@0.5.7-rc.1 "误发版本，请使用 0.5.6" --//registry.npmjs.org/:_authToken="${NPM_TOKEN}" || true
          echo "latest -> 0.5.6; 0.5.7-rc.1 deprecated"
