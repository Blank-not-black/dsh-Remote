name: gitee-release-sync

# Gitee 正式发布改由维护者本机运行 scripts/sync-gitee-release.sh 和
# scripts/sync-gitee-code.sh，避免 GitHub runner 跨境上传长时间卡住。
# 此 workflow 仅保留为人工应急入口，不再由 Release 或 release-build 自动触发。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 Release tag（如 v0.6.0）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-gitee:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo '无法确定要同步的 Release tag'
            exit 1
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Syncing release: ${TAG}"

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          bash scripts/sync-gitee-release.sh
          bash scripts/sync-gitee-code.sh
