name: gitee-release-sync

# Gitee 正式发布改由维护者本机运行 scripts/sync-gitee-release.sh 和
# scripts/sync-gitee-code.sh，避免 GitHub runner 跨境上传长时间卡住。
# 此 workflow 仅保留为人工应急入口，不再由 Release 或 release-build 自动触发。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 Release tag（如 v0.6.0）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-gitee:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo '无法确定要同步的 Release tag'
            exit 1
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Syncing release: ${TAG}"

      - name: Diagnose Gitee response
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          token = os.environ.get('GITEE_TOKEN', '')
          if not token:
              raise SystemExit('Gitee publishing credential is not configured')
          root = 'https://gitee.com/api/v5'
          repo = '/repos/Blankneverfails/dsh-Remote'
          for name, path, mode in [
              ('releases-token-header', repo + '/releases', 'token'),
              ('releases-bearer-header', repo + '/releases', 'Bearer'),
              ('releases-access-token', repo + '/releases', 'query'),
              ('repository-access-token', repo, 'query'),
              ('account-access-token', '/user', 'query'),
          ]:
              url = root + path
              headers = {'Accept': 'application/json'}
              if mode == 'query':
                  url += '?' + urlencode({'access_token': token})
              else:
                  headers['Authorization'] = mode + ' ' + token
              try:
                  with urlopen(Request(url, headers=headers), timeout=10) as response:
                      body = json.loads(response.read(1024 * 1024))
                      print(name, response.status, type(body).__name__)
              except HTTPError as error:
                  raw = error.read(4096)
                  try:
                      data = json.loads(raw)
                      message = data.get('message') or data.get('error_description') or data.get('error') or ''
                  except (ValueError, AttributeError):
                      message = 'Non-JSON error response'
                  print(name, error.code, str(message).replace(token, '[redacted]')[:160])
              except (URLError, TimeoutError, ValueError) as error:
                  print(name, type(error).__name__)
          PY
