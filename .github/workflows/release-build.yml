name: release-build

# 云端构建发版资产: Android APK + Linux/Win 单文件网关, 并上传到 GitHub Release。
# - push tag v*: 自动触发(发版只需打 tag, 不再本地传大文件)
# - workflow_dispatch: 手动触发(使用当前 package.json 版本对应的 vX.Y.Z release)
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changelog 需要完整 tag 历史

      - name: Determine release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v$(node -p "require('./package.json').version")"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Release tag: ${TAG}"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        run: npm run build-app

      - name: Copy APK and write update.json
        run: npm run publish

      - name: Build single-file binaries
        run: npm run build-bin

      - name: Verify plugin sync consistency
        run: |
          npm run sync-plugin
          git diff --exit-code -- packages/plugin

      - name: Normalize binary names
        run: |
          cp dist/dsh-remote-linux dist/dsh-remote-linux-x64
          cp dist/dsh-remote-win.exe dist/dsh-remote-win-x64.exe
          ls -la dist

      - name: Publish npm
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        working-directory: packages/plugin
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          PUB_VER=$(npm view dsh-remote-plugin version 2>/dev/null || echo none)
          if [ "$PKG_VER" != "$PUB_VER" ]; then
            npm publish --access public --//registry.npmjs.org/:_authToken="$NPM_TOKEN"
          else
            echo "npm 已发布 ${PUB_VER}, skip"
          fi

      - name: Sync standalone repo
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          DSH_RELEASE_DEPLOY_KEY: ${{ secrets.DSH_RELEASE_DEPLOY_KEY }}
        run: npm run sync-standalone

      - name: Generate SHA256SUMS
        run: |
          (
            cd apk && sha256sum dsh-remote.apk
            cd ../dist && sha256sum dsh-remote-linux-x64 dsh-remote-win-x64.exe
          ) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          node -e "
            const fs = require('fs');
            const cp = require('child_process');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            let prev = '';
            try { prev = cp.execSync('git tag --sort=-v:refname | head -n 2 | tail -n 1', { encoding: 'utf8' }).trim(); } catch {}
            let log = '';
            if (prev && prev !== 'v' + p.version) {
              try { log = cp.execSync('git log --no-merges --pretty=format:\'- %s\' ' + prev + '..HEAD', { encoding: 'utf8' }).trim(); } catch {}
            }
            log = (log || '').split('\n').filter(l => l && !/^- release: v/.test(l)).join('\n');
            const sums = fs.readFileSync('SHA256SUMS.txt', 'utf8').trim();
            const body = '# DSH Remote v' + p.version + '\n\n' + (p.updateNotes || '') +
              '\n\n## 本次更新\n' + (log || '- 重新构建/发布 v' + p.version) +
              '\n\n## SHA-256 校验\n\`\`\`\n' + sums + '\n\`\`\`\n\n## 资产\n' +
              '- \`dsh-remote.apk\` Android App\n' +
              '- \`dsh-remote-linux-x64\` / \`dsh-remote-win-x64.exe\` 免 Node 单文件网关\n' +
              '- \`SHA256SUMS.txt\` 全部资产校验和\n';
            fs.writeFileSync('RELEASE_NOTES.md', body);
          "

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          body_path: RELEASE_NOTES.md
          files: |
            apk/dsh-remote.apk
            dist/dsh-remote-linux-x64
            dist/dsh-remote-win-x64.exe
            SHA256SUMS.txt
